name: Descomprimir zip
on:
  workflow_dispatch:
    inputs:
      zip:
        description: relax zip web
        default: relax-selection-fase8.zip
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir
        env:
          ZIP: ${{ inputs.zip }}
        run: |
          set -e
          test -f "$ZIP" || { echo "No encuentro $ZIP en la raíz"; exit 1; }
          unzip -q "$ZIP" -d /tmp/unzip
          # El zip trae la carpeta relax-selection/ y su historial .git, que no se copia
          rsync -a --exclude='.git' --exclude='.github' /tmp/unzip/relax-selection/ ./
          git rm -q "$ZIP"
      - name: Guardar cambios
        env:
          ZIP: ${{ inputs.zip }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Descomprimir $ZIP" || echo "Sin cambios"
          git push
